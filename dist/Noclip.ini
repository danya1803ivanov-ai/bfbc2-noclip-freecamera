; Noclip for Battlefield: Bad Company 2 (single player). Changes apply at the next F6.
; Keys are Windows virtual-key codes: F6=117 F8=119 W=87 S=83 A=65 D=68 Space=32 Ctrl=17 Shift=16 Alt=18 Backspace=8
[keys]
; free camera on/off (works in normal play and during cutscenes)
toggle=117
; pause / resume the game, cutscenes included (the in-game menu's pause, without the menu)
pause=119
forward=87
back=83
left=65
right=68
up=32
down=17
fast=16
slow=18
; while flying: switch noclip off and put the soldier back where the flight started
return_to_start=8

[camera]
; mouse look of the free camera: degrees per mouse count, and 1 = inverted vertical look
mouse_degrees_per_count=0.12
invert_y=0

[flight]
; 1 = ghost (recommended): the soldier stays where noclip was switched on and only the camera flies,
;     so the mission's area triggers, squad AI and checkpoints never see the player move.
; 0 = the soldier's body follows the camera (it WILL set off triggers and move the story on)
ghost=1
; metres per second
speed=8
fast_multiplier=5
slow_multiplier=0.25
; time to reach the target speed; 0 = instant
smoothing_seconds=0.06
; 1 = W flies where you look (incl. up/down), 0 = W stays horizontal
fly_along_view=1
; F6 off in mid-air: 1 = put the soldier on the ground below (no fall damage), 0 = leave it in the air
exit_to_ground=1

; engine bool settings switched while the body is held and restored afterwards, as Name=0/1 (advanced;
; empty by default, nothing here was needed for the tested features)
[while_noclip]

[input]
; 1 = while flying the game does not receive the flight keys (no walking/jumping/crouching sounds or
;     animations on the body left behind). Mouse movement always goes to the free camera while it is on.
block_game_input_while_flying=1
; 1 = also hide mouse buttons from the game while flying (no shooting from the body)
block_mouse_buttons=1

[hud]
; 1 = hide the game's HUD/UI while flying (crosshair, ammo, minimap, markers, hints, subtitles)
hide_while_flying=1
; 0 = automatic: keep the frame's 3D composite (first back-buffer draws with the same shader), drop the
; UI drawn after it. N > 0 = keep exactly N back-buffer draws per frame (2 on build 795745 / DX11)
keep_draws=0
; 1 = log per-frame back-buffer draw counts every 600 frames (diagnostics)
log_stats=0
